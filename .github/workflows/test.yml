on: push

name: Test

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --all-features

      - name: cargo test (post-archiver-tools)
        run: cargo test --manifest-path post-archiver-tools/Cargo.toml
